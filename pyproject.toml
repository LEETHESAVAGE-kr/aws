[project]
name = "hazop-copilot"
version = "0.1.0"
description = "HAZOP 위험성평가 코파일럿 — 고려대 x AWS AI Innovators Challenge 2026"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1",   # 골드셋 xlsx 읽기·워크시트 xlsx 내보내기 (FR-01, FR-07)
    "pyyaml>=6.0",     # config/models.yaml 로드 (모델 ID·리전 하드코딩 금지)
    "jsonschema>=4.21", # schemas/deviation.schema.json 검증 (CLAUDE.md 불변규칙 4)
    "pydantic>=2.7",   # DeviationRecord 등 데이터 모델 (steering engineering.md §3)
    "boto3>=1.34",     # Bedrock Converse API 호출 (FR-02)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",     # 오프라인 기본 테스트 + live 마커
    "ruff>=0.5",       # 유일한 린터·포매터 (black/isort/flake8 금지)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["E501"]  # line-length는 formatter가 처리

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real AWS credentials and network access",
]
