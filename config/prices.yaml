# config/prices.yaml — 모델별 USD / 1,000 tokens (REQ-09, design.md §10)
#
# 구조: 최상위 키가 모델 ID, 값이 {input, output, cache_read, cache_write}.
# 출처: .kiro/specs/bedrock-client/requirements.md §REQ-09 표 및 design.md §10.
#       **AWS 공식 가격 페이지로 직접 확인한 값이 아니며, 대회 계정에서 실제로 호출 가능한
#       모델도 아직 미확정이다(G0 미완료).**
# 가격표에 없는 모델 ID 는 예외 대신 비용 0 + WARNING 1회로 처리한다 (AC-09).
# G0 통과 후 실제 사용 모델의 공식 가격으로 이 파일을 갱신할 것.

us.anthropic.claude-3-5-sonnet-20241022-v2:0:
  input: 0.003
  output: 0.015
  cache_read: 0.0003
  cache_write: 0.00375

us.anthropic.claude-3-haiku-20240307-v1:0:
  input: 0.00025
  output: 0.00125
  cache_read: 0.000025
  cache_write: 0.0003

amazon.titan-embed-text-v2:0:
  input: 0.00002
  output: 0.0
  cache_read: 0.0
  cache_write: 0.0

# ── provider=anthropic 후보 모델 (REQ-12 / T-15, 2026-09-22 추가) ──────────────
# 출처: claude-api 스킬 번들(2.1.215) 의 "Current Models" 표 — input/output $ per 1M tokens,
#       캐시 기준일 2026-06-24. 캐시 배수는 같은 번들 shared/prompt-caching.md:
#       "Cache reads cost ~0.1x base input price. Cache writes cost 1.25x for 5-minute TTL."
#       → cache_read = input x 0.1, cache_write = input x 1.25 (기본 5분 TTL 기준).
# ⚠ 공식 pricing 페이지를 직접 조회한 값이 아니라 스킬 번들에 캐시된 표를 옮긴 값이다.
#   claude-sonnet-5 의 도입가($2/$10)는 2026-08-31 종료되어 정상가를 적었다.
#   실제 사용 모델은 2단계에서 확정되며, 표에 없는 ID 는 비용 0 + WARNING 으로 처리된다(AC-09).
claude-opus-4-8: # $5.00 / $25.00 per 1M
  input: 0.005
  output: 0.025
  cache_read: 0.0005
  cache_write: 0.00625

claude-sonnet-5: # $3.00 / $15.00 per 1M
  input: 0.003
  output: 0.015
  cache_read: 0.0003
  cache_write: 0.00375

claude-haiku-4-5: # $1.00 / $5.00 per 1M
  input: 0.001
  output: 0.005
  cache_read: 0.0001
  cache_write: 0.00125

# ── 본선 대회 제공 API 키 모델 ID (PRD_본선_고도화 F-01-3, 2026-10-08 선등재) ─────────────
# 출처: 10/8 API 신청서의 신청 모델명. **게이트웨이가 실제로 받는 ID 인지는 키 수령 후 확인.**
# 단가는 **추정** — 대회 고지 단가가 없어 대응 Anthropic 모델 단가(위 표)를 그대로 옮겼다.
# 등재 이유: 빠지면 비용이 조용히 $0 으로 기록된다(9/28 haiku 날짜 ID 사례). 고지 단가가 오면 교체.
bedrock-claude-opus-4-8: # = claude-opus-4-8 추정
  input: 0.005
  output: 0.025
  cache_read: 0.0005
  cache_write: 0.00625

bedrock-claude-sonnet-5: # = claude-sonnet-5 추정
  input: 0.003
  output: 0.015
  cache_read: 0.0003
  cache_write: 0.00375

bedrock-haiku: # = claude-haiku-4-5 추정 (신청서 표기 그대로 — 버전 미상)
  input: 0.001
  output: 0.005
  cache_read: 0.0001
  cache_write: 0.00125