# config/models.yaml — 모델 ID·리전의 단일 소스 (steering aws.md §2, REQ-01)
# 이 파일만 수정하면 전체 모델 교체가 적용된다. 코드에 하드코딩 금지.
#
# ⚠ 2026-09-15: 대회 계정에 Bedrock 권한 없음 확인 → provider=anthropic 으로 개발. 예선 제출본도 anthropic
#   (Bedrock 실호출 0회 — README §4). bedrock 전환은 권한 확보 후 이 파일의 provider 한 줄.
#   2026-09-28: models.list() 결과(12개)를 보고 사람이 아래 2개를 선택했다 — 추측 기입 아님.
#   provider=anthropic 인 동안 region·embedding.model_id·guardrails 는 비어 있어도 검증을 통과한다(REQ-12).
#
# ⚠ temperature 는 요청에 실리지 않는다. core/llm/anthropic_client.py 가 최신 모델(Opus 4.7+·Sonnet 5·
#   Fable 5)에서 sampling 파라미터가 400 을 돌려주는 것을 피해 일부러 생략한다. 아래 값은 provider=bedrock
#   전환 시점에 되살아난다 — provider=anthropic 동안의 재현성은 temperature 가 아니라 프롬프트·스키마가 담보한다.

provider: anthropic # bedrock | anthropic. provider 는 REQ-12 공급자 교체용. 실측은 anthropic

region: ap-northeast-2 # Bedrock 전용. provider=anthropic 동안에는 쓰이지 않는다.

generation:
  model_id: claude-opus-4-8 # 상위. $5/$25 per 1M — config/prices.yaml 에 등재됨
  temperature: 0.2
  max_tokens: 16384 # 9/28 예선 데모용 4096→16384 — 절단 방지(E-2 갈래 ①). 지연은 못 줄임, 본선 지시문 G 에서 재검토
  prompt_caching: true
  enumerate_examples: false # R-12(본선 F-06): 열거 프롬프트에 공개 HAZOP 예시(data/kb). 측정은 tools/measure_enumerate.py
  evidence_k: 0 # Y-3: 판정 호출에 넣는 법령·고시 발췌(파라미터당 검색 수, 호출당 최대 10문단). 0 = 끔. Y-G5 측정(사전등록) 뒤에 켠다
  inference_boundary: false # Z-1~Z-3: 정보 4단계·노드 유형별 추론 경계(data/kb/inference_policy.json)·셀 보류(정보 부족). 사전등록 실측 뒤 켠다
  parallel_calls: 7 # R-10: 가이드워드 판정 동시 호출 수. 1 이면 순차. X-G7(10/8) 병렬 4 138.8초 vs 7 79~126초, 429 0회 → 7 (results/xg7_20261008_2350)

verifier:
  # 하위(저비용). $1/$5 per 1M. 목록은 claude-haiku-4-5-20251001 로 오지만 **별칭을 쓴다** —
  # prices.yaml 키가 claude-haiku-4-5 라서, 날짜 붙은 ID 를 넣으면 가격표 조회가 빗나가 비용이 0 으로 기록된다.
  model_id: claude-haiku-4-5
  temperature: 0.0
  max_tokens: 1024
  prompt_caching: false

# 대회 AI 모델 게이트웨이(OpenAI 호환) — 「AI 모델 API 사용 가이드」(넥스트클라우드, 10/9 수령) 1·3쪽.
# HAZOP_PROVIDER=gateway(.env / Streamlit Secrets) 로 켠다. 키는 KIRO_API_KEY(환경변수)만.
# 별칭은 GET /v1/models 결과(10/9): bedrock-claude-opus-4-8 · bedrock-claude-sonnet-5 · bedrock-haiku — 추측 기입 아님.
gateway:
  base_url: https://52.79.201.46/v1
  # ⚠ 10/9 실측: 허용 목록이 ['"bedrock-claude-opus-4-8', 'bedrock-claude-sonnet-5', 'bedrock-haiku"'] 로
  #   첫·끝 별칭에 따옴표가 붙어 있어 opus·haiku 는 403(key_model_access_denied). 운영 측 수정 전까지 sonnet-5 만 쓴다.
  #   sonnet-5 실호출 1회 성공(구조화 출력 정상, 2.1초). 수정되면 generation 을 opus-4-8, verifier 를 haiku 로 되돌린다.
  generation_model_id: bedrock-claude-sonnet-5
  verifier_model_id: bedrock-claude-sonnet-5

embedding:
  model_id: null # ← 임베딩 모델 ID 기입

guardrails:
  id: null # Bedrock Guardrails 생성 후 ID 입력 (NFR-05)

cost_limit_usd: 0.30 # 노드 1건 소프트 상한 (WARNING 로그 기준, REQ-07)
